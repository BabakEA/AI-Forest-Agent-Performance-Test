name: AFPerf tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      # Collect independent results from every supported Python version.
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip build twine
      # Install the test extra so tomli is present on Python 3.10.
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Build and validate distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m build --sdist --wheel
          python -m twine check dist/*
      - name: Upload candidate dist (CI artifact; not a public release)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: afperf-candidate-dist
          path: dist/
          if-no-files-found: error
